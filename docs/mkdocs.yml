site_name: tkfluent
copyright: Copyright &copy; 2024-2026 XiangQinxi
site_url: https://tkfluent.netlify.app/
repo_url: https://github.com/XiangQinxi/tkfluent

# 断链/断锚点默认只是 INFO（--strict 也不会失败）。中文标题的锚点会被 slugify 成
# #_1 这类，所以需要被链接的小节请显式写 `## 标题 { #id }`（本仓库已统一）。
validation:
  links:
    anchors: warn
    absolute_links: warn

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            allow_inspection: true
  - meta
  - search:
      lang: zh
  - offline
  - blog:
      post_dir: "blog/posts"
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

theme:
  icon:
    annotation: material/arrow-right-circle
  logo: assets/logo.png
  name: material  # 主题
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.instant
    - content.code.copy
    - content.tabs.link
    - navigation.footer  # Footer
    - content.tooltips  # ToolTip
    - blog  # Blog
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
  language: zh

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - abbr
  - attr_list
  - pymdownx.snippets
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      # 注意：这里**刻意不配 mermaid**。Material 的 mermaid 支持是运行时从
      # unpkg CDN 拉脚本的，而本站启用了 offline 插件——离线打开时图会消失。
      # 流程图统一放在 docs/diagrams/*.mmd，由 gen_figures.py 预渲染成
      # docs/assets/*.png，页面只引用图片（见 docs/README.md）。
      custom_fences: []

